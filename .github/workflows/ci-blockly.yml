
name: Blockly CI

on:
  push:
    branches: [main, dev, 'feature/blockly-*']
    paths:
      - 'learning/blockly/**'
      - 'ai/llm/blockly_generator.py'
      - 'tests/blockly/**'
      - 'ui/src/routes/student/blockly/**'
      - 'ui/src/lib/apis/blockly/**'
      - '.github/workflows/ci-blockly.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'learning/blockly/**'
      - 'ai/llm/blockly_generator.py'
      - 'tests/blockly/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── ÉTAPE 4+5 : Tests unitaires + intégration backend ─────────────────────
  backend-tests:
    name: "🐍 Tests Backend Blockly"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer dépendances CI
        run: pip install -r requirements-ci.txt

      - name: "Étape 4 — Tests unitaires (sandbox + progression)"
        run: |
          pytest tests/blockly/test_sandbox.py \
                 tests/blockly/test_progression.py \
                 -v --tb=short \
                 -q

      - name: "Étape 5a — Tests router (endpoints)"
        run: |
          pytest tests/blockly/test_router.py \
                 -v --tb=short

      - name: "Étape 5b — Tests intégration (flux complets)"
        run: |
          pytest tests/blockly/test_integration.py \
                 -v --tb=short

      - name: "Rapport de couverture"
        run: |
          pytest tests/blockly/ \
                 --cov=learning/blockly \
                 --cov=ai/llm/blockly_generator \
                 --cov-report=term-missing \
                 --cov-fail-under=70

  # ── ÉTAPE 6 : Tests E2E Cypress ──────────────────────────────────────────
  e2e-tests:
    name: "🌐 Tests E2E Cypress Blockly"
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Installer dépendances Python
        run: pip install -r requirements-ci.txt

      - name: Démarrer le backend
        run: |
          uvicorn main:app --port 8080 &
          sleep 6
          curl -f http://localhost:8080/health || exit 1
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "true"

      - name: Installer dépendances frontend
        run: cd ui && npm ci

      - name: Build frontend
        run: cd ui && npm run build

      - name: Démarrer le frontend (preview)
        run: |
          cd ui
          npm run preview -- --port 5173 &
          sleep 5

      - name: "Étape 6 — Tests E2E Cypress"
        uses: cypress-io/github-action@v6
        with:
          working-directory: ui
          spec: cypress/e2e/blockly/**/*.cy.ts
          browser: chrome
          headless: true
        env:
          CYPRESS_BASE_URL: http://localhost:5173

      - name: Upload screenshots si échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-blockly
          path: ui/cypress/screenshots/
          retention-days: 7
